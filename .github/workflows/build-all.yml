name: build-all

# يشتغل يدوياً من تاب Actions في GitHub (زرار "Run workflow")
# أو تلقائي مع أي push على dev أو main
on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - main

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies (root)
        run: bun install

      - name: Build desktop app assets
        working-directory: packages/desktop
        run: bun run build
        env:
          OPENCODE_CHANNEL: prod

      - name: Package Windows .exe
        working-directory: packages/desktop
        run: bun run package:win
        env:
          OPENCODE_CHANNEL: prod

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: nitro-code-windows
          path: packages/desktop/dist/*.exe
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies (root)
        run: bun install

      - name: Build desktop app assets
        working-directory: packages/desktop
        run: bun run build
        env:
          OPENCODE_CHANNEL: prod

      # ملحوظة: البناء ده غير موقّع (unsigned) لأننا مش عندنا حساب Apple Developer.
      # المستخدمين هيحتاجوا يعملوا "right-click > Open" أول مرة عشان macOS تسيبهم يشغلوه
      # (Gatekeeper بيرفض تلقائي أي تطبيق مش موقّع من نفس النقرة العادية).
      - name: Package macOS .dmg
        working-directory: packages/desktop
        run: bun run package:mac
        env:
          OPENCODE_CHANNEL: prod
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: nitro-code-macos
          path: packages/desktop/dist/*.dmg
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies (root)
        run: bun install

      - name: Build desktop app assets
        working-directory: packages/desktop
        run: bun run build
        env:
          OPENCODE_CHANNEL: prod

      - name: Package Linux AppImage
        working-directory: packages/desktop
        run: bun run package:linux
        env:
          OPENCODE_CHANNEL: prod

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: nitro-code-linux
          path: packages/desktop/dist/*.AppImage
          if-no-files-found: error

  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      # بينشئ Release دائم واحد على GitHub فيه الـ.exe و.dmg و.AppImage التلاتة
      # مع رابط تحميل مباشر وثابت تقدر تبعته لأي حد
      - name: Create unified GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nitro-code-v${{ github.run_number }}
          name: "Nitro Code v${{ github.run_number }}"
          files: |
            dist/nitro-code-windows/*.exe
            dist/nitro-code-macos/*.dmg
            dist/nitro-code-linux/*.AppImage
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
