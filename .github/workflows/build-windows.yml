name: build-windows

# يشتغل يدوياً من تاب Actions في GitHub (زرار "Run workflow")
# أو تلقائي مع أي push على dev (فرع الشغل بتاعك دلوقتي)
on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - main

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies (root)
        run: bun install

      - name: Build desktop app assets
        working-directory: packages/desktop
        run: bun run build
        env:
          OPENCODE_CHANNEL: prod

      - name: Package Windows .exe
        working-directory: packages/desktop
        run: bun run package:win
        env:
          OPENCODE_CHANNEL: prod

      - name: Upload .exe as artifact
        uses: actions/upload-artifact@v4
        with:
          name: nitro-code-windows
          path: |
            packages/desktop/dist/*.exe
          if-no-files-found: error

      # بينشئ Release دائم على GitHub برابط تحميل مباشر وثابت،
      # عشان تقدر تبعته لأي حد من غير ما يحتاج يدخل على حسابك أو الريبو نفسه
      - name: Create GitHub Release with the .exe
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nitro-code-v${{ github.run_number }}
          name: "Nitro Code v${{ github.run_number }}"
          files: packages/desktop/dist/*.exe
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
